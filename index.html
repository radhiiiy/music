<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

    <div class="phone-card">

        <!-- HEADER -->
        <header class="topbar">
            <h1>For You</h1>
            <div class="topbar-actions">
                <button class="pill pill-sync" id="syncBtn">
                    <span class="pill-emoji">🎯</span> Sinkron
                </button>
                <button class="pill pill-search" id="searchBtn">
                    <span class="pill-emoji">🔍</span> Cari Lagu
                </button>
                <button class="pill pill-mode" id="modeBtn">
                    <span class="pill-emoji" id="modeEmoji">🔁</span> <span id="modeLabel">Urut</span>
                </button>
            </div>
        </header>

        <!-- ALBUM ART / PHOTO -->
        <div class="art-frame" id="artFrame">
            <img id="artPhoto" alt="" class="art-photo" style="display:none;">
            <svg id="artFallback" class="art-fallback" viewBox="0 0 100 100" width="72" height="72">
                <path
                    d="M62 20c-16 0-29 13-29 30s13 30 29 30c6 0 11-1.6 16-4.5-19 2-35-13-35-32s16-34 35-32c-5-2.9-10-4.5-16-4.5Z"
                    fill="#FFD874" />
            </svg>
        </div>

        <!-- TRACK INFO -->
        <div class="track-row">
            <div>
                <h2 id="songTitle">1000X</h2>
                <p id="songArtist">Ghea Indrawari</p>
            </div>
            <button class="heart-btn" id="heartBtn" title="Favorit">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" id="heartIcon">
                    <path
                        d="M12 21s-7.5-4.7-10-9.3C.5 8.2 2.4 4.5 6 4c2-.3 3.8.6 5 2.3C12.2 4.6 14 3.7 16 4c3.6.5 5.5 4.2 4 7.7C19.5 16.3 12 21 12 21Z"
                        stroke="#C9B6FF" stroke-width="1.8" />
                </svg>
            </button>
        </div>

        <!-- LYRICS -->
        <div class="lyrics-card" id="lyricsCard">
            <!-- lyric lines injected by JS -->
        </div>

        <!-- PROGRESS -->
        <div class="progress-row">
            <input type="range" id="seekBar" min="0" max="100" step="0.1" value="0">
        </div>
        <div class="time-row">
            <span id="curTime">0:00</span>
            <span id="durTime">0:00</span>
        </div>

        <!-- CONTROLS -->
        <div class="controls-row">
            <button class="ctrl-btn ctrl-side" id="prevBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 6h2v12H6zM20 6v12L9 12z" />
                </svg>
            </button>
            <button class="ctrl-btn ctrl-main" id="playBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff" id="playIcon">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>
            <button class="ctrl-btn ctrl-side" id="nextBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M16 6h2v12h-2zM4 6v12l11-6z" />
                </svg>
            </button>
        </div>

    </div>

    <!-- SEARCH / SONG LIST MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>🎵 Semua Lagu</h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <input type="text" id="searchInput" class="search-input" placeholder="Cari judul atau penyanyi...">
            <ul class="song-list" id="songList"></ul>
        </div>
    </div>

    <audio id="audio"></audio>

    <script src="songs.js"></script>
    <script src="script.js"></script>
</body>

</html>
